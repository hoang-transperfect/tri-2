name: Release

on:
  push:
    branches:
      - main

# Only one release job at a time — prevent race conditions on concurrent main pushes.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push version bump commits + create GitHub releases
      pull-requests: write  # open/update the "Version Packages" PR
      id-token: write       # npm provenance attestation

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # changesets needs full history for changelog generation

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # changesets/action does one of two things depending on repo state:
      #   • Changesets present  → opens/updates a "Version Packages" PR (no publish)
      #   • No changesets       → runs `publish` command and creates a GitHub release
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: '0'
          npm_config_provenance: 'true'
